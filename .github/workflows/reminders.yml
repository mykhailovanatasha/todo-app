name: Telegram reminders

# Роут сам знає години кожного користувача (налаштовуються в застосунку) і шле
# те, чий час настав за Києвом. Запускаємось щопівгодини; повторний виклик
# захищений від дубля (одне нагадування на слот на день).
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        run: curl -fsS "https://todo-app-nata.vercel.app/api/cron"
